name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_control_plane.py
      - run: python3 tools/workspace_doctor.py --manifest examples/workspace.toml
      - run: python3 tools/audit_publication.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q tools tests
      - run: git diff --check
